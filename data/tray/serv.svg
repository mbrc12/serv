<?xml version="1.0" encoding="UTF-8"?>
<!--
  serv menu-bar glyph: a triangle with a download arrow in the middle.

  Rendering is black geometry on a transparent canvas, i.e. a macOS template
  image, so the system inverts it for dark menu bars. Triangle and arrow share
  one stroke width, which is what keeps their corner radii identical, and the
  arrow is centred on the triangle's incenter rather than the bounding box so it
  does not look top-heavy.

  Regenerate the PNGs with: uv run python tools/make_tray_icon.py
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path d="M12 2.6 L22.2 21.0 L1.8 21.0 Z"
        fill="none" stroke="#000000" stroke-width="1.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M10.85 9.6 L13.15 9.6 L13.15 13.6 L15.3 13.6 L12 18.6 L8.7 13.6 L10.85 13.6 Z"
        fill="#000000" stroke="#000000" stroke-width="1.4"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
