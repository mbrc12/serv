# Prebuilt color schemes, ordered by family and then light → dark: Tokyo Night,
# Catppuccin, Gruvbox, Nord, Solarized. The settings window lists them in file
# order, so keep that order when adding a scheme.
#
# Every value here is a color from the scheme's own published palette (Tokyo
# Night, Catppuccin, Gruvbox, Nord, Solarized). Nothing is lightened or
# darkened: where a role needs contrast, it uses a different member of the same
# palette instead of a new shade.
#
# Picking one copies these values into ~/.config/serv/serv.toml; that file stays
# the single source of truth. A scheme must define every color serv uses.

# --------------------------------------------------------------------- Tokyo Night

[schemes.tokyo-night-day]
label = "Tokyo Night Day"

[schemes.tokyo-night-day.palette]
bg = "#e1e2e7"
text = "#343746"
muted = "#6172b0"
border = "#c4c8da"
hover = "#d0d5e3"
selected = "#b7c1e3"
selected_text = "#343746"
