# Prebuilt colour schemes shown in the settings window's Colours section.
#
# Picking one copies these values into the palette, accents and code sections of
# ~/.config/serv/serv.toml; the file stays the single source of truth. A scheme
# must define every colour serv uses, otherwise it is rejected at startup.
#
# The first scheme matches config/serv.toml, so "Tokyo Night Day" is what a new
# installation uses.

[schemes.tokyo-night-day]
label = "Tokyo Night Day"

[schemes.tokyo-night-day.palette]
bg = "#e1e2e7"
text = "#343746"
muted = "#6172b0"
border = "#c4c8da"
hover = "#d0d5e3"
selected = "#b7c1e3"
zebra = "transparent"
red = "#f52a65"
orange = "#b15c00"
green = "#587539"
blue = "#2e7de9"
teal = "#007197"
purple = "#7146a6"

[schemes.tokyo-night-day.accents]
markdown = "#7146a6"
listing = "#7146a6"
directory = "#2e7de9"

[schemes.tokyo-night-day.code]
base = "#403a36"
comment = "#6a6258"
keyword = "#a64b00"
operator = "#9b1c31"
string = "#1f6b3a"
function = "#3152a0"
number = "#7136a2"
tag = "#006d69"
highlight = "rgba(113, 70, 166, 0.16)"

