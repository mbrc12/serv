# Font choices for the reading and monospace roles.
#
# Every entry is a Google Fonts family plus the axis query needed to load the
# weights serv uses (body 400, bold 600, and italics for prose). The settings
# page lists these; entering another family name uses a locally installed font
# and skips the Google Fonts request.
#
# To add a family, add an entry and check that its URL loads:
#   https://fonts.googleapis.com/css2?family=<Name>:<weights>

[reading]
label = "Reading font"
default = "Crimson Pro"

[[reading.fonts]]
name = "Crimson Pro"
weights = "ital,wght@0,400;0,600;1,400"

